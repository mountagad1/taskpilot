<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TaskPilot</title>
  <style>
    /*
      System fonts only. Manifest V3 blocks remote resources on extension
      pages, so an @import of a webfont fails silently and leaves the popup
      rendering in the browser default.
    */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0d16;
      --surface: rgba(255,255,255,0.05);
      --surface-hover: rgba(255,255,255,0.09);
      --border: rgba(255,255,255,0.09);
      --fg: #f0f1f8;
      --fg2: rgba(240,241,248,0.62);
      --fg3: rgba(240,241,248,0.38);
      --indigo: #6366f1;
      --indigo-light: #818cf8;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
    }

    html, body {
      width: 380px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13.5px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Header */
    .header { display: flex; align-items: center; gap: 10px;
      padding: 13px 15px; border-bottom: 1px solid var(--border); }
    .logo { width: 26px; height: 26px; border-radius: 7px; flex: none;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; color: #fff; }
    .brand { font-weight: 600; letter-spacing: -0.01em; }
    .plan { margin-left: auto; font-size: 10.5px; text-transform: uppercase;
      letter-spacing: 0.06em; padding: 3px 8px; border-radius: 20px;
      background: rgba(99,102,241,0.16); color: var(--indigo-light);
      border: 1px solid rgba(99,102,241,0.28); }

    /* Command bar */
    .command { padding: 14px 15px 12px; }
    .command-label { font-size: 11px; color: var(--fg3); margin-bottom: 7px;
      text-transform: uppercase; letter-spacing: 0.06em; }
    .command-row { display: flex; gap: 7px; }
    textarea#goal { flex: 1; resize: none;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 9px; padding: 9px 11px; color: var(--fg);
      font: inherit; outline: none; }
    textarea#goal:focus { border-color: rgba(99,102,241,0.5); }
    textarea#goal::placeholder { color: var(--fg3); }

    button { font: inherit; cursor: pointer; border: none; border-radius: 9px;
      transition: background 130ms, opacity 130ms; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-run { background: linear-gradient(135deg, #6366f1, #7c3aed);
      color: #fff; font-weight: 600; padding: 0 16px; }
    .btn-run:hover:not(:disabled) { filter: brightness(1.1); }

    .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip { background: var(--surface); border: 1px solid var(--border);
      color: var(--fg2); padding: 5px 10px; border-radius: 20px; font-size: 12px; }
    .chip:hover { background: var(--surface-hover); color: var(--fg); }

    /* Sections */
    section { border-top: 1px solid var(--border); padding: 13px 15px; }
    .section-head { display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--fg3); margin-bottom: 9px; }
    .link { color: var(--indigo-light); text-decoration: none; font-size: 12px;
      background: none; padding: 0; }
    .link:hover { text-decoration: underline; }

    /* Run status */
    #run-panel { display: none; }
    .run-goal { font-weight: 500; margin-bottom: 9px; word-break: break-word; }
    .progress-track { height: 4px; background: rgba(255,255,255,0.08);
      border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
    .progress-fill { height: 100%; width: 0%; border-radius: 4px;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      transition: width 240ms ease; }
    .steps { display: flex; flex-direction: column; gap: 5px;
      max-height: 168px; overflow-y: auto; }
    .step { display: flex; align-items: center; gap: 8px; font-size: 12.5px;
      color: var(--fg2); padding: 5px 8px; border-radius: 7px; background: var(--surface); }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--fg3); }
    .step[data-state="running"]   .dot { background: var(--indigo); animation: pulse 1s infinite; }
    .step[data-state="succeeded"] .dot { background: var(--green); }
    .step[data-state="failed"]    .dot { background: var(--red); }
    .step[data-state="skipped"]   .dot { background: var(--amber); }
    @keyframes pulse { 50% { opacity: 0.35; } }
    .step-error { color: var(--red); font-size: 11.5px; margin-left: auto; }

    /* Confirmation */
    #confirm-panel { display: none; border-top: 1px solid var(--border);
      padding: 13px 15px; background: rgba(245,158,11,0.07); }
    .confirm-title { font-weight: 600; color: var(--amber); margin-bottom: 5px; }
    .confirm-body { font-size: 12.5px; color: var(--fg2); margin-bottom: 11px;
      word-break: break-word; }
    .confirm-actions { display: flex; gap: 8px; }
    .btn-approve { background: var(--green); color: #04140a; font-weight: 600; padding: 7px 15px; }
    .btn-deny { background: var(--surface); color: var(--fg2); padding: 7px 15px;
      border: 1px solid var(--border); }

    /* Feedback */
    #error { display: none; margin: 0 15px 13px; padding: 9px 11px; border-radius: 8px;
      background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.28);
      color: #fca5a5; font-size: 12.5px; word-break: break-word; }
    .empty { color: var(--fg3); font-size: 12.5px; }

    .agent { display: flex; align-items: center; gap: 9px; padding: 7px 9px;
      border-radius: 8px; background: var(--surface); margin-bottom: 5px; cursor: pointer; }
    .agent:hover { background: var(--surface-hover); }
    .agent-name { font-size: 13px; }
    .agent-meta { margin-left: auto; font-size: 11px; color: var(--fg3); }

    /* Footer */
    footer { display: flex; align-items: center; gap: 13px; padding: 11px 15px;
      border-top: 1px solid var(--border); font-size: 12px; }
    footer a { color: var(--fg2); text-decoration: none; cursor: pointer; }
    footer a:hover { color: var(--fg); }
    .kbd { margin-left: auto; font-size: 10.5px; color: var(--fg3);
      border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">T</div>
    <div class="brand">TaskPilot</div>
    <div class="plan" id="plan">free</div>
  </div>

  <div class="command">
    <div class="command-label">What should TaskPilot do on this page?</div>
    <div class="command-row">
      <textarea id="goal" rows="3"
        placeholder="Extract every product price and export to Excel"></textarea>
      <button class="btn-run" id="run">Run</button>
    </div>
    <div class="quick" id="quick"></div>
  </div>

  <div id="error"></div>

  <div id="confirm-panel">
    <div class="confirm-title">Approval needed</div>
    <div class="confirm-body" id="confirm-body"></div>
    <div class="confirm-actions">
      <button class="btn-approve" id="approve">Allow</button>
      <button class="btn-deny" id="deny">Skip</button>
    </div>
  </div>

  <section id="run-panel">
    <div class="section-head">
      <span id="run-status">Running</span>
      <button class="link" id="cancel">Cancel</button>
    </div>
    <div class="run-goal" id="run-goal"></div>
    <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
    <div class="steps" id="steps"></div>
  </section>

  <section>
    <div class="section-head">
      <span>Marketplace agents</span>
      <a class="link" id="marketplace-link">Browse all</a>
    </div>
    <div id="agents"><div class="empty">Loading...</div></div>
  </section>

  <footer>
    <a id="dashboard-link">Dashboard</a>
    <a id="options-link">Settings</a>
    <span class="kbd">Alt+K</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
